services:
  admin-backend:
    container_name: admin-dashboard-backend
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3500:3500"

    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://akib:akib@admin-dashboard-db:5432/admindashboard

    depends_on:
      - admin-database

    volumes:
      - ./:/app
      - /app/node_modules

  admin-database:
    container_name: admin-dashboard-db
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: akib
      POSTGRES_PASSWORD: akib
      POSTGRES_DB: admindashboard

    ports:
      - "5437:5432"

    volumes:
      - admindashboard-data:/var/lib/postgresql/data

volumes:
  admindashboard-data:
